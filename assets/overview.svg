<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="315" viewBox="0 0 1600 315"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050c12"/><stop offset=".6" stop-color="#07131b"/><stop offset="1" stop-color="#090f15"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#0d2430"/></pattern></defs><rect width="1600" height="315" rx="28" fill="url(#bg)"/><rect width="1600" height="315" rx="28" fill="url(#grid)" opacity=".3"/><rect x="1" y="1" width="1598" height="313" rx="27" fill="none" stroke="#1d5266"/><text x="36" y="44" fill="#16d9ff" font-family="monospace" font-size="15">› planning_semantics</text><text x="255" y="44" fill="#879eaa" font-family="Arial" font-size="12">The model protects meaning, not just rows.</text>
<g transform="translate(40 82)"><rect width="280" height="150" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="150" rx="2" fill="#16d9ff"/><text x="18" y="25" fill="#16d9ff" font-family="monospace" font-size="9">ESTIMATE ≠ COMMITMENT</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Intent is not obligation</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">planned effort can change without rewriting the commitment</text></g><g transform="translate(335 82)"><rect width="280" height="150" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="150" rx="2" fill="#ffb547"/><text x="18" y="25" fill="#ffb547" font-family="monospace" font-size="9">DEMAND ≠ ALLOCATION</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Need is not assignment</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">resource demand stays independent from who is actually allocated</text></g><g transform="translate(630 82)"><rect width="280" height="150" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="150" rx="2" fill="#8b5cf6"/><text x="18" y="25" fill="#8b5cf6" font-family="monospace" font-size="9">FORECAST ≠ BASELINE</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Expectation is not approval</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">current forecast may move while the approved baseline stays frozen</text></g><g transform="translate(925 82)"><rect width="280" height="150" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="150" rx="2" fill="#2fe3b0"/><text x="18" y="25" fill="#2fe3b0" font-family="monospace" font-size="9">UNKNOWN ≠ ZERO</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Absence is explicit</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">no evidence never becomes a fake green status or numeric zero</text></g><g transform="translate(1220 82)"><rect width="340" height="150" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="150" rx="2" fill="#55b6ff"/><text x="18" y="25" fill="#55b6ff" font-family="monospace" font-size="9">PROVIDER ≠ PLANNER</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">Execution stays external</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">provider facts are imported without surrendering planner semantics</text></g></svg>