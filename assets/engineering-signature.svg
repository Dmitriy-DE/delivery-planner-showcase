<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="190" viewBox="0 0 1600 190"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050c12"/><stop offset=".6" stop-color="#07131b"/><stop offset="1" stop-color="#090f15"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#0d2430"/></pattern></defs><rect width="1600" height="190" rx="28" fill="url(#bg)"/><rect width="1600" height="190" rx="28" fill="url(#grid)" opacity=".3"/><rect x="1" y="1" width="1598" height="188" rx="27" fill="none" stroke="#1d5266"/><text x="36" y="44" fill="#16d9ff" font-family="monospace" font-size="15">› engineering_signature</text><text x="255" y="44" fill="#879eaa" font-family="Arial" font-size="12">Design decisions that make planning reliable and useful.</text>
<g transform="translate(35 68)"><rect width="365" height="90" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="90" rx="2" fill="#16d9ff"/><text x="18" y="25" fill="#16d9ff" font-family="monospace" font-size="9">EXPLICIT STATE</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">unknown stays unknown</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">no evidence ≠ zero</text></g><g transform="translate(416 68)"><rect width="365" height="90" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="90" rx="2" fill="#2fe3b0"/><text x="18" y="25" fill="#2fe3b0" font-family="monospace" font-size="9">APPEND-ONLY FACTS</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">revisions preserve history</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">everything stays traceable</text></g><g transform="translate(797 68)"><rect width="365" height="90" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="90" rx="2" fill="#55b6ff"/><text x="18" y="25" fill="#55b6ff" font-family="monospace" font-size="9">PROVENANCE</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">derived results retain basis</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">explain decisions end-to-end</text></g><g transform="translate(1178 68)"><rect width="387" height="90" rx="15" fill="#08141d" stroke="#1d5266"/><rect width="4" height="90" rx="2" fill="#ffb547"/><text x="18" y="25" fill="#ffb547" font-family="monospace" font-size="9">BORING INFRASTRUCTURE</text><text x="18" y="51" fill="#f4f8fb" font-family="Arial" font-size="15" font-weight="700">keep the runtime simple</text><text x="18" y="76" fill="#879eaa" font-family="Arial" font-size="10.5">modular monolith until evidence says otherwise</text></g></svg>