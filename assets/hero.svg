<text x="44" y="50" fill="#16d9ff" font-family="monospace" font-size="15">› project-planning / delivery-planner</text>
<text x="44" y="120" fill="#f4f8fb" font-family="Arial" font-size="68" font-weight="800">Delivery Planner</text>
<text x="44" y="163" fill="#b8cad4" font-family="Arial" font-size="21">Provider-neutral planning, capacity and governance workspace.</text>
<text x="44" y="198" fill="#879eaa" font-family="Arial" font-size="17">Decisions remain explainable because planning intent and provider execution stay separate.</text>
