<text x="65" y="302" fill="#f4f8fb" font-family="Arial" font-size="30" font-weight="800">Unknown is not zero.</text>
<text x="65" y="323" fill="#879eaa" font-family="Arial" font-size="11">Estimate ≠ commitment · Demand ≠ allocation · Forecast ≠ baseline</text>
