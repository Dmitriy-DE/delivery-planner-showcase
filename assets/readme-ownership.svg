<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061018"/><stop offset="1" stop-color="#0a1218"/></linearGradient></defs>
<rect width="1600" height="420" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1598" height="418" rx="25" fill="none" stroke="#1d5266"/>
<text x="48" y="58" fill="#16d9ff" font-family="monospace" font-size="24" font-weight="700">WHO OWNS WHAT?</text>
<text x="48" y="92" fill="#a8bcc8" font-family="Arial" font-size="21">Provider execution facts and Planner management facts meet in one workspace without pretending they are the same source of truth.</text>

<g transform="translate(50 138)">
<rect width="690" height="220" rx="18" fill="#0a1720" stroke="#55b6ff"/>
<text x="28" y="42" fill="#55b6ff" font-family="Arial" font-size="28" font-weight="700">Execution provider</text>
<text x="28" y="74" fill="#dfe8ed" font-family="Arial" font-size="18">Jira Cloud today · Planner Native as internal execution mode</text>
<text x="28" y="116" fill="#a4b6c0" font-family="Arial" font-size="17">Owns execution facts such as:</text>
<text x="28" y="148" fill="#f0f4f6" font-family="Arial" font-size="17">projects · work items · assignees · execution dates · estimates · worklogs</text>
<text x="28" y="190" fill="#8da4b1" font-family="Arial" font-size="16">Other provider names in the registry may be catalogue/future states, not live adapters.</text>
</g>

<g transform="translate(860 138)">
<rect width="690" height="220" rx="18" fill="#0a1720" stroke="#2fe3b0"/>
<text x="28" y="42" fill="#2fe3b0" font-family="Arial" font-size="28" font-weight="700">Delivery Planner</text>
<text x="28" y="74" fill="#dfe8ed" font-family="Arial" font-size="18">Owns planning, governance and decision context</text>
<text x="28" y="116" fill="#a4b6c0" font-family="Arial" font-size="17">Owns management facts such as:</text>
<text x="28" y="148" fill="#f0f4f6" font-family="Arial" font-size="17">capacity · calendars · absences · allocations · demand · scenarios · baselines</text>
<text x="28" y="180" fill="#f0f4f6" font-family="Arial" font-size="17">governance · forecasts · outcomes · value · finance planning</text>
</g>

<path d="M740 248H860" stroke="#1d5266" stroke-width="4"/><polygon points="860,248 842,238 842,258" fill="#1d5266"/>
</svg>