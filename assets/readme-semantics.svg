<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061018"/><stop offset="1" stop-color="#0a1218"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#10242e"/></pattern>
</defs>
<rect width="1600" height="500" rx="26" fill="url(#bg)"/><rect width="1600" height="500" rx="26" fill="url(#grid)" opacity=".28"/><rect x="1" y="1" width="1598" height="498" rx="25" fill="none" stroke="#1d5266"/>
<text x="48" y="58" fill="#16d9ff" font-family="monospace" font-size="24" font-weight="700">PLANNING TERMS · WHAT EACH ONE ACTUALLY MEANS</text>
<text x="48" y="92" fill="#a8bcc8" font-family="Arial" font-size="21">The product avoids one giant “status” field. Each object answers a different management question.</text>

<g font-family="Arial">
<g transform="translate(42 132)"><rect width="235" height="290" rx="18" fill="#0a1720" stroke="#16d9ff"/><text x="22" y="40" fill="#16d9ff" font-size="24" font-weight="700">Estimate</text><text x="22" y="72" fill="#dfe8ed" font-size="18">How much work do we</text><text x="22" y="97" fill="#dfe8ed" font-size="18">currently think it is?</text><text x="22" y="145" fill="#8da4b1" font-size="16">Revisioned planning fact.</text><text x="22" y="174" fill="#8da4b1" font-size="16">Can change over time.</text><text x="22" y="221" fill="#66df91" font-size="16" font-weight="700">Not a promise.</text></g>
<g transform="translate(296 132)"><rect width="235" height="290" rx="18" fill="#0a1720" stroke="#8b5cf6"/><text x="22" y="40" fill="#b89cff" font-size="24" font-weight="700">Commitment</text><text x="22" y="72" fill="#dfe8ed" font-size="18">What did somebody</text><text x="22" y="97" fill="#dfe8ed" font-size="18">actually commit to?</text><text x="22" y="145" fill="#8da4b1" font-size="16">Governance / promise.</text><text x="22" y="174" fill="#8da4b1" font-size="16">Tracked separately.</text><text x="22" y="221" fill="#f2c037" font-size="16" font-weight="700">Not the estimate.</text></g>
<g transform="translate(550 132)"><rect width="235" height="290" rx="18" fill="#0a1720" stroke="#ffb547"/><text x="22" y="40" fill="#ffb547" font-size="24" font-weight="700">Demand</text><text x="22" y="72" fill="#dfe8ed" font-size="18">What people / skills /</text><text x="22" y="97" fill="#dfe8ed" font-size="18">capacity does work need?</text><text x="22" y="145" fill="#8da4b1" font-size="16">Role · quantity · dates.</text><text x="22" y="174" fill="#8da4b1" font-size="16">May be unfilled.</text><text x="22" y="221" fill="#f2c037" font-size="16" font-weight="700">Need ≠ assignment.</text></g>
<g transform="translate(804 132)"><rect width="235" height="290" rx="18" fill="#0a1720" stroke="#2fe3b0"/><text x="22" y="40" fill="#2fe3b0" font-size="24" font-weight="700">Allocation</text><text x="22" y="72" fill="#dfe8ed" font-size="18">Who is actually assigned</text><text x="22" y="97" fill="#dfe8ed" font-size="18">and for what period?</text><text x="22" y="145" fill="#8da4b1" font-size="16">Person / generic resource.</text><text x="22" y="174" fill="#8da4b1" font-size="16">Capacity-aware.</text><text x="22" y="221" fill="#66df91" font-size="16" font-weight="700">Assignment ≠ demand.</text></g>
<g transform="translate(1058 132)"><rect width="235" height="290" rx="18" fill="#0a1720" stroke="#55b6ff"/><text x="22" y="40" fill="#55b6ff" font-size="24" font-weight="700">Forecast</text><text x="22" y="72" fill="#dfe8ed" font-size="18">What do current facts</text><text x="22" y="97" fill="#dfe8ed" font-size="18">suggest will happen?</text><text x="22" y="145" fill="#8da4b1" font-size="16">Derived result.</text><text x="22" y="174" fill="#8da4b1" font-size="16">Keeps basis + warnings.</text><text x="22" y="221" fill="#f2c037" font-size="16" font-weight="700">Not an approval.</text></g>
<g transform="translate(1312 132)"><rect width="246" height="290" rx="18" fill="#0a1720" stroke="#2fe3b0"/><text x="22" y="40" fill="#2fe3b0" font-size="24" font-weight="700">Baseline</text><text x="22" y="72" fill="#dfe8ed" font-size="18">What plan was formally</text><text x="22" y="97" fill="#dfe8ed" font-size="18">approved as reference?</text><text x="22" y="145" fill="#8da4b1" font-size="16">Immutable approval.</text><text x="22" y="174" fill="#8da4b1" font-size="16">Used for variance.</text><text x="22" y="221" fill="#66df91" font-size="16" font-weight="700">Forecast can move while</text><text x="22" y="244" fill="#66df91" font-size="16" font-weight="700">baseline stays intact.</text></g>
</g>
</svg>